name: Public Release Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:skills
      - run: pnpm check:privacy
      - run: pnpm check:tickets
      - run: pnpm build
      - run: pnpm check:package
      - name: Run full test suite
        run: pnpm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false

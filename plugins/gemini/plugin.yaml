# Gemini CLI adapter. Transcribed from observed configuration.
plugin: gemini
name: Gemini CLI
contract: 1

client:
  detect: [/opt/homebrew/bin/gemini, ~/.gemini/]
  version_cmd: gemini --version
  consumer_verified: false
  evidence: >
    ~/.gemini/GEMINI.md is a documented global instruction path and settings.json supports
    context.fileName (present in the v0.49 bundle). Path confirmed; consumption not
    observed. Do not describe this client as behaviourally supported.

provides:
  rules:  { path: ~/.gemini/GEMINI.md, format: markdown, verified: true }
  skills: { path: ~/.gemini/skills/, format: SKILL.md+frontmatter, verified: true }
  mcp:    { path: ~/.gemini/settings.json, key: mcpServers, format: json, verified: true }

writes: [rules, skills]

requires:
  - rules.render
  - skills.list

enforces: []

conventions:
  project_context: AGENTS.md
  project_memory: .gemini/memory/

notes: >
  SKILL.md is byte-identical to Claude's (md5 match on graphify), so skills are a straight
  copy, not a translation. Had 36 lines of hand-written rules, merged into canonical before
  the first sync.

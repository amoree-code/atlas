# Authority grants — what Atlas is permitted to actually DO on your behalf.
#
# This is the filled-in counterpart of `templates/workspace/internal/config/authority.yaml`
# — see that file for the full field-by-field explanation. Here, one capability has
# actually been granted a rung, instead of the seed's empty `capabilities: {}`.
#
#     observe                read, look, extract — changes nothing
#     propose                prepare an action without performing it
#     execute                perform a reversible action
#     execute-with-approval  perform it only after you say yes, per action, every time
#     autonomous             NOT GRANTABLE. No value here enables it.

default: observe          # applies to any capability not named below

capabilities:
  browser: execute         # the one real capability that ships today (capabilities/browser/)
                            # granted execute — everything below it (propose, observe) follows

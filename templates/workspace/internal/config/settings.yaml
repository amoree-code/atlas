# Where the public Atlas software lives on this machine. ai-sync and the client hook
# launcher read the plugin registry and commands from it. Hooks run in a non-login shell
# with a minimal PATH, so discovery via `which atlas` cannot be relied on — the location
# is recorded here instead.
#
# Leave this empty: `atlas init` fills it in with wherever the repository actually is.
# If you set it yourself, init keeps your value and never overwrites it. Moving the
# repository means updating this line (or clearing it and re-running init) — never
# editing a hook.
atlas_repo: ""

# Atlas settings. See ../../../policies/ for the policies this config participates in.

workspace: ~/atlas
active_adapter: claude-code   # change if you're using a different client as your primary

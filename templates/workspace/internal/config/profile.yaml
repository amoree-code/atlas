# Your profile — PRIVATE. The values that make the canonical skills yours.
#
# The public Atlas repository holds one canonical copy of each skill, written with
# {{profile.*}} placeholders. Your personal values live here and are injected when a skill
# is rendered for a client. That is why there is exactly one skill body to maintain
# instead of one generic copy and one personalised copy drifting apart.
#
# This file never leaves ~/.ai-os. Nothing here is ever copied into the public repo.
#
# Every key is optional. An unset key renders as an explicit [[profile.<key> unset]]
# marker — never a silent empty string, because a silently blank instruction is worse
# than a visibly missing one.

# Where your code lives.
code_root: ~/Documents

project_roots:
  # Sub-folders under code_root that projects are organised into. Leave empty if you
  # do not use org folders — the skills will ask instead of assuming.
  orgs: []
  default: ""
  personal_subdir: ""
  freelance_subdir: ""

# Your version-control account. project-register uses it to decide whether a repo is
# yours (context may be committed) or someone else's (context stays local).
vcs_owner: ""

stack:
  # A short phrase naming the technologies a recommendation must not ignore.
  summary: ""
  # Where your full stack conventions are recorded.
  doc: ~/.ai-os/personal/memory/preferences/development.md

code_graph:
  # A local code-graph tool, if you use one, for structural questions on large repos.
  tool: ""
  output: ""

agents:
  # Named sub-agents your setup delegates to. Leave blank if you have none.
  curator: ""       # memory/knowledge classification
  scribe: ""        # checkpoints, logs, summaries
  reasoning: ""     # the model used for architecture and hard debugging
  bookkeeping: ""   # the cheapest model that does routine recording reliably

# Where the workspace helper scripts and document templates live.
# NOTE: these currently point into ~/.ai, the legacy runtime layer. That is a declared,
# single-keyed dependency rather than a path hardcoded across fifteen files, and it is one
# of the conditions gating ~/.ai's eventual removal.
scripts_dir: ~/.ai-os/internal/helpers
templates_dir: ~/.ai-os/personal/templates

# OpenAI Codex CLI adapter. Transcribed from observed configuration.
adapter: codex
name: OpenAI Codex CLI
contract: 1

client:
  detect: [~/.local/bin/codex, ~/.codex/]
  version_cmd: codex --version
  consumer_verified: false
  evidence: >
    ~/.codex/AGENTS.md existed (empty) before any sync, created by Codex itself — evidence
    it knows the path, NOT evidence it reads what we write there. No observation of Codex
    behaviour changing in response to synced rules has been made. Do not describe this
    client as behaviourally supported until that observation exists.

provides:
  rules:  { path: ~/.codex/AGENTS.md, format: markdown, verified: true }
  skills: { path: ~/.codex/skills/, format: SKILL.md+frontmatter, verified: true }
  hooks:  { path: ~/.codex/hooks.json, format: json, verified: true }
  mcp:    { path: ~/.codex/config.toml, key: mcp_servers, format: toml, verified: true }

writes: [rules, skills]

requires:
  - rules.render
  - skills.list

enforces: []                # no enforcement mechanism implemented for this client

conventions:
  rules_title: "# Global rules (AGENTS.md)"
  project_context: AGENTS.md
  project_memory: .codex/memory/

notes: >
  Codex has 6 MCP servers Claude does not (node_repl, computer-use, arxiv, context7,
  cua_repl, memory) and 7 caveman skills of its own. Writing is additive and never deletes
  client-local entries. MCP is not written: the formats genuinely differ (toml vs json) and
  there are no canonical servers to translate.
  A user-written instruction block currently sits OUTSIDE the managed markers in AGENTS.md
  and is preserved on every write.

# Atlas policy — private workspace boundary.
# Client-agnostic. Each adapter enforces it in whatever mechanism it has.

policy: workspace-privacy
version: 1

principle: >
  The user's workspace ($AI_OS_HOME, default ~/.ai-os) is PRIVATE BY DEFAULT. Assume it
  contains personal information, personal memory and knowledge, private project names and
  context, session history, daily records, personal goals and preferences, and private
  configuration. Being inside the workspace is never evidence that content is safe to
  expose. Local git tracking does not change this: versioning is not publishing.

rules:
  workspace.add_remote:
    approval: always
    reason: >
      The workspace repository is local-only by design. Adding a remote makes personal
      data publishable in one command, and commit history — including committer email —
      cannot be un-published afterwards.

  workspace.push:
    approval: always
    reason: same as above; there should be no remote to push to in the first place.

  workspace.export:
    approval: always
    reason: copying workspace content out of the machine crosses the trust boundary.

  workspace.upload:
    approval: always

  workspace.sync_external:
    approval: always
    reason: any external service — cloud sync, backup provider, vector store, API.

  workspace.copy_to_public_repo:
    approval: always
    reason: >
      The most likely accident. Content may only move private → public after explicit
      per-item classification, and in practice should be REWRITTEN generically rather
      than copied. Copying preserves names, paths and phrasing that identify the user.

  workspace.read_by_local_client:
    approval: never
    reason: >
      A local AI client reading the workspace is the intended use. This stays local and
      is governed by ordinary local policy.

boundary:
  private: $AI_OS_HOME            # default ~/.ai-os
  public: the ai-os repository
  invariant: >
    Neither may be nested inside the other. A nested repository is a defect, not a
    configuration — detect and report it, never hide it with .gitignore.

enforcement:
  known_adapters:
    claude-code: partial   # ai-guard-push covers push/remote commands; export/copy are
                           # judgment calls the agent must escalate, not mechanically blocked
    codex: not-implemented
    gemini: not-implemented
  local_guards:
    - no remote configured on the workspace repository   # primary
    - workspace .git/hooks/pre-push refuses              # bypassable with --no-verify
    - workspace .git/hooks/pre-commit blocks credentials
    - ai-os workspace status / ai-os-doctor report nested repositories and missing hooks

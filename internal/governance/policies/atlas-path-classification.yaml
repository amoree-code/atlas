# Atlas policy — path-based privacy classification and publication eligibility.
#
# The two-root boundary (workspace-privacy.yaml: "$ATLAS_HOME is private, the repo is
# public") assumed the physical root already told you which side of the line a file was
# on. That assumption breaks once $ATLAS_HOME holds private and publishable material in
# one tree (personal/knowledge/decisions/atlas-one-project-architecture.md item 2). This
# policy is the replacement principle: privacy is a property of the path/classification,
# never of which physical root happens to contain it.
#
# Temporary ownership: this file lives at its CURRENT live governance location (this repo,
# not $ATLAS_HOME/governance/) because Phase E has not moved governance yet
# (AIOS-020/migration-plan.md). It already describes $ATLAS_HOME paths. Do not create a
# second copy under $ATLAS_HOME/governance/ before Phase E promotes it — one authoritative
# source only.

policy: atlas-path-classification
version: 1
since: T-004
atlas_home: ~/atlas   # AIOS-020 / atlas-one-project-architecture.md item 11

# --- classes -------------------------------------------------------------------------
classes:
  private:
    definition: must never be published, full stop
    publication_eligible: false
    examples: [personal/**, private project records, credentials/secrets, user-specific registries]

  local:
    definition: machine/runtime state — not source material for publication, distinct from `private` (which means durable-personal, not transient)
    publication_eligible: false
    examples: [runtime/**, temporary workspaces, telemetry, observations, locks, caches]

  publishable:
    definition: reusable Atlas source eligible to ENTER the publication pipeline — never means auto-published
    publication_eligible: true
    still_requires: [content/credential scan, owner approval]

  mixed:
    definition: contains both publishable and private/local material depending on the specific record
    publication_eligible: false   # private by default; per-item promotion is a future mechanism, not built by this policy
    rule: >
      A mixed root is never publication-eligible at the root level. An individual path
      inside it becomes eligible only through an explicit future promotion mechanism
      (not built here) — never by defaulting the whole root open.

# --- the fourteen frozen roots, classified -------------------------------------------
# `evidence` names the AIOS-020/candidate-tree.md verdict this is grounded in — none of
# this is a fresh guess. Three deviate from the informal starting point this ticket was
# handed, because candidate-tree.md's own evidence was stronger: `projects/` and
# `integration/` are classified `private`/`mixed` here, not the softer reading a first
# pass might reach — see the `note` field on each.
roots:
  core:         { class: publishable, evidence: "candidate-tree.md core/: Durable software. Publishable." }
  context:      { class: publishable, evidence: "candidate-tree.md context/: Publishable (mechanism is client-agnostic); nothing private lives here itself." }
  personal:     { class: private,     evidence: "candidate-tree.md personal/: Private, never publishable, non-negotiable." }
  projects:     { class: private,     evidence: "candidate-tree.md projects/: Project-name-level PII, never publishable.",
                  note: "Not classified `mixed` despite containing some publishable-shaped content (e.g. this ticket's own contracts work) — candidate-tree.md already ruled the whole root never publishable; a future promotion mechanism, not this policy, is where a specific record could ever leave." }
  adapters:     { class: mixed,       evidence: "candidate-tree.md adapters/: Publishable, except any client-specific private config a user adds." }
  capabilities: { class: publishable, evidence: "candidate-tree.md capabilities/: Publishable at the contract level." }
  domains:      { class: publishable, evidence: "candidate-tree.md domains/: Publishable." }
  extensions:   { class: mixed,       evidence: "candidate-tree.md extensions/: Publishable for skill/agent bodies; MCP registrations may carry private connection detail — classify per-entry, not per-root." }
  governance:   { class: mixed,       evidence: "candidate-tree.md governance/: client-agnostic rules/policies publishable, authority.yaml and workspace-specific policy text private." }
  contracts:    { class: publishable, evidence: "candidate-tree.md contracts/: Publishable (contracts are not PII)." }
  runtime:      { class: local,       evidence: "candidate-tree.md runtime/: Generated/transient. Private (may contain workspace content); never publishable as data." }
  integration:  { class: mixed,       evidence: "candidate-tree.md integration/: Private (task content may pass through it); durable once reconciled, runtime while an attempt is in flight — never itself a publishable root.",
                  note: "Not `local/publishable` — candidate-tree.md never calls it publishable. Runtime-in-flight state is `local`-shaped, reconciled output is `private`-shaped (task content); neither sub-case is `publishable`, so the root is `mixed` defaulting closed, not split toward publishable." }
  docs:         { class: publishable, evidence: "candidate-tree.md docs/: Publishable." }
  tests:        { class: publishable, evidence: "candidate-tree.md tests/: Publishable (suite)." }

# --- per-file promotion inside a mixed root (T-028, extended T-029) --------------------
# `mixed` roots above are private-by-default at the root level, with per-item promotion
# named as "a future mechanism, not built by this policy". T-028 built that mechanism,
# scoped to `governance/`. T-029 extends the same mechanism to `extensions/` (the Phase D3
# merge of the public skills/ + private internal/extensions/{agents,capabilities,mcp,
# skills}). `adapters` and `integration` still get no promotion table by either change;
# both stay exactly as default-deny as before. Enforced in `cli/atlas_atlas_privacy.py`'s
# `GOVERNANCE_FILE_CLASSES` / `EXTENSIONS_FILE_CLASSES` tables, which this section mirrors
# for human review.
promotions:
  governance:
    mechanism: "per-file table, keyed by path relative to governance/, default-deny for anything not listed"
    private:
      - README.md
      - authority.yaml
      - rules/core.md
      - policies/README.md
      - policies/context.md
      - policies/git.md
      - policies/graph.md
      - policies/knowledge.md
      - policies/lifecycle.md
      - policies/memory.md
      - policies/models.md
      - policies/privacy-terms.txt
      - policies/response.md
      - policies/stack.md
      - policies/task.md
      - policies/verification.md
    publishable:
      # still requires content/credential scan + owner approval — promotion only narrows
      # what is even eligible to reach that gate, per `publication_model` below.
      - product/README.md
      - product/atlas-path-classification.yaml
      - product/git.yaml
      - product/handoff-transports.yaml
      - product/privacy-allowlist.txt
      - product/privacy-classification.yaml
      - product/public-private-contract.yaml
      - product/workspace-privacy.yaml
  extensions:
    mechanism: "per-file table, keyed by path relative to extensions/, default-deny for anything not listed"
    private:
      - skills/README.md
      - agents/architect.md
      - agents/debugger.md
      - agents/memory-curator.md
      - agents/task-scribe.md
      - capabilities/README.md
      - mcp/README.md
      - mcp/config/.gitkeep
      - mcp/registry/.gitkeep
      - mcp/servers/.gitkeep
    publishable:
      # still requires content/credential scan + owner approval — promotion only narrows
      # what is even eligible to reach that gate, per `publication_model` below.
      - skills/catch-up/SKILL.md
      - skills/day-start/SKILL.md
      - skills/graphify/SKILL.md
      - skills/graphify/.graphify_version
      - skills/graphify/references/add-watch.md
      - skills/graphify/references/exports.md
      - skills/graphify/references/extraction-spec.md
      - skills/graphify/references/github-and-merge.md
      - skills/graphify/references/hooks.md
      - skills/graphify/references/query.md
      - skills/graphify/references/transcribe.md
      - skills/graphify/references/update.md
      - skills/project-init/SKILL.md
      - skills/project-register/SKILL.md
      - skills/research/SKILL.md
      - skills/session-end/SKILL.md
      - skills/session-handoff/SKILL.md
      - skills/workspace-health/SKILL.md
      - agents/README.md

# --- publication model -----------------------------------------------------------------
publication_model: >
  candidate path -> path classification (this policy, default-deny) -> [if publishable]
  content/credential scan (atlas-privacy-scan) -> verification -> owner approval -> publish.
  Path classification is a gate, not a pipeline: it only ever narrows what reaches the
  scan. Nothing here performs a scan or a publish; both stay exactly where they are today.

default: deny   # an unrecognized root, or any path not resolving under a known root, is never eligible

# --- relationship to existing mechanisms (KEEP / ADAPT / SUPERSEDE LATER) --------------
# Nothing below is deleted or weakened by this policy. The old two-root guarantees stay
# fully in force for as long as ~/atlas and the public repo both still hold real content
# (transition period — all three paths coexist: ~/atlas, ~/Documents/amir/atlas-engine, ~/atlas).
relationship:
  workspace-privacy.yaml:            { verdict: KEEP,             why: "still the live, enforced boundary for the two current physical roots; not superseded until they stop existing" }
  privacy-classification.yaml:       { verdict: KEEP,             why: "credential/personal CONTENT classification is orthogonal to path classification — both layers stay" }
  privacy-allowlist.txt:             { verdict: KEEP,             why: "content-level false-positive suppression; unrelated concern to path-level publication eligibility" }
  public-private-contract.yaml:      { verdict: ADAPT-LATER,      why: "its principle (access is not ownership) survives; its two-physical-layers framing is what this policy starts replacing — adapting it is a later slice, not this one" }
  ai-guard-push / owner approval:    { verdict: KEEP,             why: "remote/push/publish approval gates are unchanged; this policy adds a check BEFORE that gate, never removes it" }
  atlas-privacy-scan (content scan): { verdict: ADAPT,            why: "gained one additive path-classification entry point (--atlas-classify); its existing content-scan behavior for the two current roots is untouched" }

# --- enforcement -------------------------------------------------------------------------
enforcement:
  module: cli/atlas_atlas_privacy.py   # the enforced version of the `roots` table above
  command: atlas privacy-scan --atlas-classify <path>
  destructive: false   # classifies; never scans content, never publishes, never edits

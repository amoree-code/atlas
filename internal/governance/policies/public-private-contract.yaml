# Atlas policy — the Public / Private contract.
#
# This is the load-bearing boundary of the whole system. Everything else in Atlas
# assumes it holds. It is declared here once, client-agnostically; `atlas doctor`
# checks it, and each adapter enforces it in whatever mechanism it has.

policy: public-private-contract
version: 1
since: V0.1.3

principle: >
  Access is not ownership. The CLI may read and write the user's private workspace —
  that is its job. It does not follow that the public repository owns, tracks, ships, or
  may publish any of that content. Ownership is decided by which layer the artifact
  belongs to, never by which layer happens to be able to reach it.

# --- the two layers ----------------------------------------------------------------
# There are two, and there is no third. The runtime directory at ~/.ai was retired: its
# engine became this repository's cli/, its client integration became adapters/<client>/,
# and its transient state became $ATLAS_HOME/runtime/ — a directory inside the private
# workspace, owned by the workspace, not a layer with an owner of its own.
layers:

  public:
    what: the reusable Atlas software — publishable, installable by anyone
    default_root: the atlas repository, wherever it is cloned
    owns:
      - code
      - cli
      - adapters
      - capabilities
      - domain declarations
      - governance policies
      - schemas
      - public skills
      - templates          # initialization seeds only — see templates.contract below
      - documentation
      - tests
      - public examples
    must_never_contain:
      - personal memory
      - personal knowledge
      - personal projects, session records or daily records
      - identity, names, emails, phone numbers
      - credentials, tokens, API keys
      - private repository names
      - absolute user paths
      - user-specific configuration values

  private:
    what: the user's own world — everything the user knows, remembers, owns and configures
    default_root: $ATLAS_HOME (default ~/atlas)
    owns:
      - memory
      - knowledge
      - projects
      - internal/sessions
      - daily records
      - personal configuration
      - personal skills
      - identity
      - user preferences
      - private state
    classification: private-by-default   # see workspace-privacy.yaml

# --- the retired third layer --------------------------------------------------------
# Kept as a record so the history stays legible: this was once a layer, and is not one
# now. Nothing may be built against it.
legacy_runtime:
  former_root: ~/.ai
  status: retired
  where_it_went: >
    Its engine became <atlas>/cli/, its client integration became adapters/<client>/, the
    user's own data moved into the private workspace, and its transient state became
    $ATLAS_HOME/runtime/.
  enforcement: >
    atlas doctor treats ~/.ai as a legacy location, not a live layer. It passes when the
    directory is absent or inert, and fails when it still holds active Atlas components or
    when symlinks still resolve out of it.

# --- invariants doctor checks -----------------------------------------------------
invariants:
  distinct_roots: >
    public != private. The engine repository may occupy exactly $ATLAS_HOME/engine
    when the private root is unversioned (T-046). Other nesting is forbidden.
    Public symlinks must never expose private content. The engine retains its separate
    repository boundary; placing it under Atlas does not make private data publishable.
  private_is_local_only: >
    The private workspace repository has no remote. The public repository may have one.
    They are never the same repository and never share history.
  direction_of_flow: >
    public -> private is allowed, and only at initialization (templates seed a new
    workspace). private -> public is never automatic; it requires explicit per-item
    approval, and in practice means rewriting content generically rather than copying it.
  access_is_not_ownership: >
    A symlink, an env var, or a hook granting the CLI or a client access to private data
    does not reclassify that data. Memory reached through a client's own per-project
    memory directory is still private-workspace-owned.

# --- ownership classes for anything init creates ----------------------------------
ownership_classes:
  system-default:
    meaning: seeded once from a public template; Atlas's opinion of a sensible starting point
    on_update: never overwritten; divergence from the template is reported, never resolved
  user-owned:
    meaning: written by the user or by the agent on the user's behalf; the user's property
    on_update: never touched by any Atlas tool
  generated:
    meaning: derived from other content and reproducible (indexes, registries, manifests)
    on_update: may be regenerated, but only by the tool that owns it
  runtime:
    meaning: transient execution state
    on_update: may be discarded freely

# --- templates ---------------------------------------------------------------------
templates:
  contract: >
    Templates are initialization SEEDS, not synchronized files. After init, the template
    and the user's live file are two unrelated documents. Divergence is the expected
    steady state, not a defect.
  rules:
    - a template is copied only when nothing exists at the destination
    - an existing destination is never overwritten, never merged, never diffed into
    - divergence is reported so the user can act; the tool does not act
    - changing a public template has no effect on any existing workspace
  not_yet: three-way merge, template versioning, update migration

# --- configuration -----------------------------------------------------------------
configuration:
  precedence: atlas defaults < user configuration < project configuration
  rules:
    missing_key: may be added by an update
    existing_key: the user's value is preserved, always
    removed_key: left in place; deletion is the user's call
  not_yet: schema validation, typed config, migrations

# --- skills -------------------------------------------------------------------------
skills:
  resolution_order: [user, public]
  rule: >
    On a name collision the user's skill wins. Public skills are never copied into the
    private workspace at init — copying would turn public software into user files and
    make it un-updatable. They stay in the public repository and are resolved by name.
  user_store: $ATLAS_HOME/internal/extensions/skills
  public_store: <atlas>/skills
  never: overwrite, delete or modify a user skill

enforcement:
  diagnostics: atlas doctor            # reports; never repairs
  privacy_scan: atlas privacy-scan     # see privacy-classification.yaml
  known_adapters:
    claude-code: partial               # ai-guard-push covers push/remote; the rest is judgment
    codex: not-implemented
    gemini: not-implemented

# Atlas policy — data classification for the public repository.
#
# Secret scanning is not enough. A repository can be entirely free of credentials and
# still publish who the user is, where they live on disk, and what they are working on.
# These are two different failure modes with two different fixes, so they are classified
# separately.

policy: privacy-classification
version: 1
since: V0.1.3

classes:

  credential:
    definition: a value that grants access to something
    severity: block
    rationale: >
      Publication is irreversible and immediately exploitable. Rotation is the only
      remedy, and it has to happen whether or not anyone noticed.
    detectable: generically   # the shapes are standardized, so patterns are portable
    examples: [private key blocks, cloud access keys, provider API keys, VCS tokens, JWTs, connection strings with a password]

  personal:
    definition: a value that identifies a person, their machine, or their private work
    severity: block-in-public-repo
    rationale: >
      Nothing is compromised, but the point of the public repository is that it can be
      published. A real name, a home directory path, or a client's repository name in the
      history cannot be taken back either.
    detectable: partly       # shapes are generic; the actual terms are user-specific
    examples: [real names, email addresses, phone numbers, absolute home paths, private repository names, account handles, employer or client names]

  benign:
    definition: content that resembles a finding but carries no information
    severity: ignore
    examples: [example.com addresses, placeholder paths, documented pattern strings, the detector's own regexes]

# --- publishability exceptions ------------------------------------------------------
# `personal` is severity block-IN-PUBLIC-REPO. Two cases are therefore not findings at
# all, because in them nothing becomes public. Both are narrow, both are reported in the
# scan header rather than applied silently, and NEITHER touches `credential` — a
# credential is a finding everywhere, always, with no exceptions in this file.
exceptions:

  git_ignored_files:
    rule: personal findings are exempt in a file git ignores; credentials are not
    why: >
      An ignored file is never committed and never published, so a name or a home path
      in it identifies the user only to the user. The motivating case is graphify-out/ —
      derived graph state, rebuilt on demand, gitignored, and full of absolute local
      paths by construction. Deleting it to satisfy the scan would be treating the
      report as the problem, and the next `graphify update` would bring it straight back.
    scope: >
      Decided by `git ls-files -o -i --exclude-standard`, so .gitignore,
      .git/info/exclude and the user's core.excludesFile all count. Empty when the path
      is not a repository.
    credentials: >
      Still scanned and still blocking. An ignored file — .env is the obvious one — is a
      common home for a real secret, and credential recall is never traded away.
    override: --include-ignored restores the strict, everything-is-scanned behaviour

  license_attribution:
    rule: on the copyright line of a licence file, an owner name or email is attribution
    why: >
      A licence is required to name its copyright holder. Reporting that is the scanner
      misreading its own purpose: the name is published deliberately, by the owner, as
      the legal point of the file.
    scope: >
      Only LICENSE/LICENCE/COPYING/NOTICE (with .md/.txt), only a line that actually
      matches a copyright notice, and only the `user term` and `email address` shapes.
      A home path on that same line is still a finding. Any other line of the file is
      still scanned normally. Any other file is unaffected.
    not_an_allowlist_entry: >
      Deliberately a context rule in the scanner, not a string in
      internal/governance/policies/privacy-allowlist.txt. Putting the owner's real name in the allowlist
      would ship that name in the public repository — the exact failure this scanner
      exists to prevent. A context rule carries no name.

# --- where the terms come from ------------------------------------------------------
# The critical design point. A scanner that hardcodes the user's name, email, employer
# and repository names IS ITSELF a leak, and it would ship in the public repository.
# So the public half carries only generic shapes; the identifying terms live private.
term_sources:
  generic_patterns:
    where: built into the scanner
    contains: shapes only — no name, no email, no path, no repository, belonging to anyone
  user_terms:
    where: $AI_OS_HOME/internal/governance/policies/privacy-terms.txt
    contains: the user's own identifying strings, one per line, '#' comments allowed
    classification: private   # never copied to, referenced by, or committed in the public repo
    optional: true            # absent means generic-only scanning, with a warning
  allowlist:
    where: <ai-os>/internal/governance/policies/privacy-allowlist.txt
    contains: known-benign strings that would otherwise match
    purpose: keep the signal-to-noise ratio high enough that the scan is actually run

scope:
  scan: [working tree, staged content]
  also_scan_on_request: git history       # --history; slow, and findings there need rewriting, not deletion
  never_scan: [$AI_OS_HOME, ~/.ai]        # private and runtime are expected to contain all of this

false_positives:
  stance: >
    A scanner that cries wolf gets disabled, and a disabled scanner protects nothing.
    Prefer a missed low-severity personal match over a wall of noise — the credential
    patterns are the ones tuned for recall.
  techniques: [allowlist file, skip binaries and .git, minimum entropy/length on generic key shapes, ignore the policy files that define the patterns, exempt personal findings in git-ignored files, exempt licence copyright attribution]

enforcement:
  command: ai-os privacy-scan
  exit: non-zero on any finding
  destructive: false        # reports; never edits, never deletes, never rewrites history

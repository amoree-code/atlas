# Handoff transports — how an approved packet actually reaches a destination client.
#
# `ai-os handoff send` never invents a transport. It reads this file, and if the entry for
# the destination client is missing, unverified, or its binary is absent, the send is
# REFUSED and a blocker is written into the handoff record. There is no flag, environment
# variable or argument that raises a transport's privileges or bypasses `verified`.
#
# ## Why `verified` starts false
#
# This registry follows the same rule as adapters/: documentation is not evidence.
# `--help` proving a flag exists is not proof that handing that client a real packet works,
# is safe, and returns something a human wants. Only a real, owner-run trial is — and that
# trial is V6 of AIOS-011. Until then every transport here is declared and disabled, and
# `ai-os handoff send` records a blocker rather than pretending.
#
# ## What a transport may be
#
# A transport is ONE local, visible, foreground, one-shot invocation of a client the owner
# already has installed. It is not a connector, not a daemon, not a background job, not a
# retry loop, not MCP, and not a network call this repository makes itself.
#
#   least privilege   every argv below pins the client's own read-only mode. A transport
#                     that cannot be run read-only does not belong in this file.
#   packet on stdin   never in argv — argv is world-readable in `ps`, and a long packet
#                     would hit the argument-length limit.
#   no shell          argv is a list, executed directly. Nothing is ever interpolated
#                     into a shell string.
#   one call          no retry, no poll, no backoff. A failure is recorded, not retried.
#
# ## Enabling one
#
# 1. Run the client's one-shot mode by hand with a real packet and watch what happens.
# 2. If it is safe and it works, set `verified: true` here and replace `evidence:` with
#    what was actually observed — the command, the date, and the outcome.
# 3. That edit is the owner's decision and lives in git history where it can be reviewed.

contract: 1

# ---------------------------------------------------------------------------------
# Roles, and which client fills each one.
#
# The flow was written around client names — "Codex plans, Claude executes" — which bakes
# two vendors into the architecture and has to be rewritten when either changes. A role is
# the stable half: the work is planning or execution or review regardless of who does it.
# A packet is addressed to a ROLE, and this map says who currently holds it.
#
# Changing a name here re-points the flow. Nothing else needs to change, and no transport
# gains any privilege from being named: `send` still refuses anything not `verified: true`
# in the registry below.
roles:
  planner: codex # frames the work and produces the plan
  executor: claude-code # makes the change
  verifier: codex # reviews what was returned
  explorer: claude-code # large disposable reads, isolated from the parent
  scribe: claude-code # bookkeeping: summaries, logs, records

transports:

  codex:
    name: OpenAI Codex CLI, non-interactive one-shot
    binary: codex
    argv: [exec, --sandbox, read-only, --skip-git-repo-check, -]
    stdin: packet
    timeout: 300
    verified: true
    evidence: >
      Owner-run trial on 2026-09-02 against the PATH binary, `codex-cli 0.147.0`, using
      `codex exec --sandbox read-only --skip-git-repo-check -` with the V6 packet on stdin.
      Codex started in read-only sandbox mode, printed the received packet, did not touch
      files, did not run commands, did not send anything onward, and returned a bounded
      refusal because the packet itself said "run no command" while asking for a repo
      readiness review. This proves the transport path delivers stdin to Codex in the
      intended foreground read-only mode. It does not prove the V6 review is complete; a
      second packet must allow read-only inspection of the scoped files.

  claude-code:
    name: Claude Code CLI, non-interactive print mode
    binary: claude
    argv: [-p, --tools, "", --permission-mode, manual, --]
    stdin: packet
    timeout: 300
    verified: true
    evidence: >
      Owner-run trial on 2026-09-02 against Claude Code using
      `claude -p --tools "" --permission-mode manual --` with the
      `handoff-v6-trial-claude-code` packet on stdin. Claude replied that the packet
      arrived intact and complete, both `packet:begin` and `packet:end` markers were
      present, header fields and body sections were parsed, and the delivery was a single
      stdin delivery. Claude reported that it read no files, wrote no files, ran no
      commands, gave no approval, forwarded nothing, and created no remote or push. This
      proves the corrected one-shot transport path for safe arrival checks; execution with
      tools remains a separate approval and transport design.

  # Level 3 pilot candidate. Keep unverified until the exact non-interactive argv is
  # trialed with an approved packet and Codex reviews the returned evidence.
  claude-code-tools-pilot:
    name: Claude Code CLI, bounded non-interactive Read/Edit pilot
    binary: claude
    argv: [-p, --no-session-persistence, --restricted, --strict-mcp-config, --add-dir, projects/ai-os/tickets/AIOS-012, --tools, Read,Edit, --permission-mode, acceptEdits, --permission-prompts, none, --max-budget-usd, "0.10", --]
    stdin: packet
    timeout: 300
    verified: true
    evidence: >
      Owner-approved corrected direct trial on 2026-09-06 used this exact argv with a 0.10 USD
      cap, one approved AIOS-012 directory, and one named file. Claude used only `Read,Edit`,
      returned a bounded result, and reported no Bash, network, MCP, Git, or out-of-scope
      access. The corrected send/receive lifecycle is being run under a new packet.

  # T-051-S7 live pilot transport. Unlike claude-code-tools-pilot above (hard-coded to one
  # historical AIOS-012 trial directory, left untouched here), this entry's --add-dir value
  # is the single fixed placeholder `__MISSION_SCOPE_DIR__`. It is never read literally: a
  # caller must resolve it through `cli/aios_mission.build_mission_pilot_argv`, which
  # substitutes it — and only it, exactly once — with the canonical, symlink-resolved
  # directory derived from ONE T-051 mission handoff's own already-approved single-file
  # scope (see `resolve_mission_pilot_directory`). That function refuses an absolute or
  # traversal-shaped scope, a directory that resolves outside the Atlas root, a directory
  # that is the Atlas root itself, or a scope that would resolve to more than one
  # directory. No other token in this argv is ever substituted.
  #
  # Owner-approved promotion after review of T-051-S7's disposable and live pilot evidence.
  claude-code-mission-pilot:
    name: Claude Code CLI, bounded non-interactive Read/Edit mission-scoped pilot
    binary: claude
    argv: [-p, --no-session-persistence, --restricted, --strict-mcp-config, --add-dir, __MISSION_SCOPE_DIR__, --tools, "Read,Edit", --permission-mode, acceptEdits, --permission-prompts, none, --max-budget-usd, __MISSION_BUDGET_USD__, --]
    stdin: packet
    timeout: 300
    verified: true
    evidence: >
      Owner-approved promotion on 2026-09-07 after review of T-051-S7's recorded evidence.
      The exact mission-scoped argv ran twice against disposable fixture tickets through
      `mission execute`, each call used only `Read,Edit`, and substituted its approved
      mission slice budget into the spend flag,
      edited only its own approved file, and passed mission verification. T-051-S7-R1 also
      confirmed lease/claim acquisition and release around the bounded subprocess call.
      See projects/ai-os/tickets/T-051/T-051-S7-live-pilot-implementation.md and
      projects/ai-os/tickets/T-051/T-051-S7-R1-implementation.md for the recorded evidence.

  # Provider-neutral Gemini pilot candidate. Explicitly unverified: no owner-run trial has
  # happened against this argv. Per this file's own contract, `verified: false` means
  # `ai-os handoff send` REFUSES to invoke it — declared and disabled, not guessed and
  # live, exactly like every other transport before its first owner-run trial. Its `tools`
  # scope is read-only only (Read), so it cannot mutate anything even after verification.
  # It reuses the same __MISSION_SCOPE_DIR__ / __MISSION_BUDGET_USD__ placeholder contract
  # as claude-code-mission-pilot: a caller must resolve both through the same approved
  # mission pilot argv builder — the scope directory from one already-approved single-file
  # mission scope, the budget from that mission's own approved slice budget — before this
  # entry may ever be trialed. No other token in this argv is ever substituted. Whether the
  # underlying `gemini` binary actually accepts `--include-directories` and
  # `--max-budget-usd` as written here is itself unconfirmed; that is precisely what the
  # first owner-run trial (per the "Enabling one" steps above) must establish before
  # `verified` may ever be flipped to `true`.
  gemini-cli-mission-pilot:
    name: Gemini CLI, bounded non-interactive read-only mission-scoped pilot
    adapter: gemini
    binary: gemini
    argv: [--sandbox, --approval-mode, plan, --include-directories, __MISSION_SCOPE_DIR__, --prompt, "Return exactly JSON: {\"status\":\"pilot_ok\"}. Read no files and make no changes."]
    stdin: packet
    timeout: 300
    verified: false
    evidence: >
      Reverted to unverified 2026-09-08: this entry's argv previously restricted tools
      with `--allowed-tools`, which `gemini --help` itself marks DEPRECATED ("Use Policy
      Engine instead") and describes as controlling confirmation prompts, not which
      tools can run — this registry's own contract treats a flag like that as
      "restricting nothing" for a real security boundary. `--allowed-tools Read` has
      been removed from argv below. There is no real `--tools`-equivalent flag on the
      actual gemini CLI today (confirmed via `gemini --help`); a real restriction would
      have to go through gemini's Policy Engine, which is undesigned and untried here.
      Do not flip back to `true` without a confirmed, real restriction mechanism for
      this binary and a fresh owner trial against the corrected argv.

      Prior trial (2026-09-07, kept for context only — it tested the now-removed
      `--allowed-tools` flag): owner-run trial against the PATH binary `gemini`, using
      `gemini --sandbox --approval-mode plan --include-directories engine/cli --allowed-tools Read --output-format json --prompt 'Return exactly JSON: {"status":"pilot_ok"}. Read no files and make no changes.'`
      The CLI started in headless mode, read no files, and successfully returned the requested `{"status":"pilot_ok"}` JSON without timing out. This proves the transport path itself is reachable — it does not prove any tool restriction, since `--allowed-tools` is no longer part of this argv and never provided one.

  # cursor and opencode have no entry on purpose. An absent transport is a clean refusal;
  # a guessed one is a command run against a client nobody checked.

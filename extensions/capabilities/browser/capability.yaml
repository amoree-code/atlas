# Browser control. Atlas owns the capability; the provider owns browser mechanics.
#
# No engine, vendor or AI client is named anywhere in this manifest — the provider is
# selected at runtime and is replaceable without touching this file or Core.
plugin: browser
name: Browser Control
contract: 1

capability:
  # Available when a provider can actually drive a browser. The capability's own
  # `browser detect` answers that, so no engine path is hardcoded here.
  authority: execute-with-approval   # the ceiling; most operations sit well below it

operations:
  open:
    summary: start a browser session
    command: browser
    authority: execute
    idempotent: false
    verify: browser-verify
  close:
    summary: end a browser session and release the browser
    command: browser
    authority: execute
    idempotent: true
    verify: browser-verify
  navigate:
    summary: go to a URL in the current session
    command: browser
    authority: execute
    idempotent: true
    verify: browser-verify
  read:
    summary: read the visible text of the current page
    command: browser
    authority: observe
    idempotent: true
    verify: browser-verify
  observe:
    summary: report page state — url, title, and the interactive elements present
    command: browser
    authority: observe
    idempotent: true
    verify: browser-verify
  extract:
    summary: extract text or an attribute from elements matching a selector
    command: browser
    authority: observe
    idempotent: true
    verify: browser-verify
  click:
    summary: click an element
    command: browser
    authority: execute
    idempotent: false
    verify: browser-verify
  type:
    summary: type text into an element
    command: browser
    authority: execute
    idempotent: false
    verify: browser-verify
  select:
    summary: choose an option in a select element
    command: browser
    authority: execute
    idempotent: false
    verify: browser-verify
  scroll:
    summary: scroll the page
    command: browser
    authority: execute
    idempotent: true
    verify: browser-verify
  wait:
    summary: wait for a selector or a URL pattern to appear
    command: browser
    authority: observe
    idempotent: true
    verify: browser-verify
  upload:
    summary: attach a local file to a file input
    command: browser
    authority: execute-with-approval
    idempotent: false
    verify: browser-verify
  download:
    summary: capture a download triggered by clicking an element
    command: browser
    authority: execute-with-approval
    idempotent: false
    verify: browser-verify
  submit:
    summary: submit a form — irreversible from Atlas's point of view
    command: browser
    authority: execute-with-approval
    idempotent: false
    verify: browser-verify

notes: >
  Every operation returns structured JSON on stdout. `browser-verify` re-reads live
  browser state and confirms the claimed post-condition; it never trusts the operation's
  own report, which is why executed and verified are separate outcomes. Operations that
  change the world outside Atlas — click, type, select, upload, download, submit — are
  idempotent:false and are never retried automatically.

# Headroom — reversible context compression for tool output, logs and files before they
# reach the model. Atlas owns the capability; `headroom` (github.com/headroomlabs-ai/
# headroom, Apache-2.0) is never installed by Atlas. Absent binary => passthrough,
# never a failure and never lossy-by-surprise.
plugin: headroom
name: Headroom Context Compression
contract: 1

capability:
  detect: [~/.local/bin/headroom, /opt/homebrew/bin/headroom, /usr/local/bin/headroom]
  authority: observe

operations:
  compress:
    summary: compress text read from stdin, reversibly, before it enters context; passthrough unchanged if headroom is not installed
    command: headroom-compress
    authority: observe
    idempotent: true

notes: >
  Overlaps `atlas-observe` and `rtk.reduce` deliberately little: this is for content that
  is neither a re-runnable shell command (rtk) nor a command's own captured output
  (atlas-observe) — a file, a log, or a RAG chunk already in hand. Do not stack it on top
  of the other two for the same content; per the reviewed integration document, that adds
  latency and possible information loss for no measured benefit.